else if (id === "resume") { ST.go("play"); ST.sfx("tap"); }
else if (id === "menu") { ST.go("title"); ST.sfx("tap"); }
else if (ST.G.button) ST.G.button(id);
};
ST.tapAt = (x, y) => {
if (ST.scene === "over" && ST.sceneT < 0.4) return;        // no accidental "again" from the last frantic tap
const b = ST.hitBtn(x, y);
if (b) { ST.seq++; ST.press(b.id); return; }
if (ST.scene === "play" && ST.G.tap && ST.G.tap(x, y)) ST.seq++;
};
ST.onKey = code => {
const ok = code === "Enter" || code === "Space";
if (ST.sw.tour && code === "F8" && ST.scene === "play") { ST.seq++; ST.end(); return; }   // robot screen tour only
if (ST.scene === "title" && ok && !ST.sw.card) { ST.seq++; ST.start(); }
else if (ST.scene === "play" && (code === "KeyP" || code === "Escape")) { ST.seq++; ST.press("pause"); }
else if (ST.scene === "paused" && (ok || code === "KeyP" || code === "Escape")) { ST.seq++; ST.press("resume"); }
else if (ST.scene === "over" && ok && ST.sceneT > 0.6) { ST.seq++; ST.press("again"); }
else if (ST.G.key) { if (ST.G.key(code)) ST.seq++; }
};
ST.row = (list, y) => {
const gap = 8, h = ST.small ? 46 : 52, w = Math.min(ST.small ? 130 : 170, (ST.cw - 16 - gap * (list.length - 1)) / list.length);
let x = (ST.cw - (w * list.length + gap * (list.length - 1))) / 2;
for (const b of list) { ST.button(b.id, x, y, w, h, b.label, { on: b.on }); x += w + gap; }
return y + h;
};
ST.lines = (lines, y, color, fs) => {
for (const l of lines) for (const ln of ST.wrap(l, ST.cw - 24, fs)) { ST.text(ln, ST.cw / 2, y, color, fs, "c"); y += 7 * fs + Math.max(3, fs * 2); }
return y;
};
ST.veil = a => { ST.ctx.fillStyle = `rgba(10,6,16,${a})`; ST.ctx.fillRect(0, 0, ST.cw, ST.ch); };
ST.drawTitle = () => {
const T = ST.G.title, big = ST.fs * 1.5;
let y = ST.small ? 50 : 60;
ST.text(T.name, ST.cw / 2, y, ST.theme.on, big, "c"); y += 7 * big + (ST.small ? 6 : 12);
y = ST.lines(T.lines || [], y, ST.theme.text, ST.small ? 1 : ST.fs * 0.75) + (ST.small ? 4 : 10);
if (ST.sw.card) { ST.text(T.cardLine || "PLAY IT RIGHT HERE IN THE POST", ST.cw / 2, y + 8, ST.theme.text, ST.fs, "c"); return; }
y = ST.row([{ id: "play", label: "PLAY" }, ...(T.extra || []).map(b => ({ id: b.id, label: b.label(), on: b.on && b.on() }))], y);
if (T.footer) { const f = T.footer(); if (f) ST.text(f, ST.cw / 2, y + 8, ST.theme.text, ST.small ? 1 : ST.fs * 0.75, "c"); }
};
ST.drawPauseBtn = () => ST.button("pause", ST.cw - 96, 2, 44, 44, "II");
ST.drawPaused = () => {
ST.veil(0.72);
const y = ST.small ? 56 : 90;
ST.text("PAUSED", ST.cw / 2, y, ST.theme.on, ST.fs * 1.5, "c");
ST.row([{ id: "resume", label: "RESUME" }, { id: "menu", label: "MENU" }], y + 7 * ST.fs * 1.5 + 14);
};
ST.drawOver = () => {
const o = ST.overInfo || { title: "GAME OVER", lines: [] }, big = ST.fs * 1.5;
ST.veil(o.win ? 0.4 : 0.55);
let y = ST.small ? 50 : 70;
ST.text(o.title, ST.cw / 2, y, o.win ? ST.theme.on : "#e0525e", big, "c"); y += 7 * big + 10;
y = ST.lines(o.lines || [], y, ST.theme.text, ST.small ? 1 : ST.fs * 0.75) + 6;
ST.row([{ id: "again", label: "AGAIN" }, { id: "menu", label: "MENU" }], y);
};
ST.ticks = 0; ST.time = 0;
ST.hidden = false;
document.addEventListener("visibilitychange", () => {
ST.hidden = document.hidden;
if (ST.hidden && ST.scene === "play") ST.go("paused");   // scrolled away = auto-pause (input.js already cleared held input)
});
ST.update = dt => {
ST.ticks++; ST.time += dt; ST.sceneT += dt;
if (ST.G.tick) ST.G.tick(dt);                    // always (animations, title backdrop)
if (ST.scene === "play") ST.G.update(dt);         // only while playing
};
ST.draw = () => {
if (!ST.g || !ST.cw) return;                     // frames can start at 0x0: nothing to draw yet
const c = ST.ctx, d = ST.DPR();
c.setTransform(d, 0, 0, d, 0, 0);
ST.btns = []; ST.uiTexts = []; ST.hud = []; ST.uiBottom = 0; ST.trackUI = true; ST.hudMode = false;
ST.G.draw(ST.time);                               // the game paints its world into ST.g (and may draw on ST.ctx after present)
if (!ST.G.presents) ST.present();
if (ST.G.overlay) ST.G.overlay();                 // optional: draw on the main canvas over the world (e.g. a 3D view)
if (ST.scene === "title") ST.drawTitle();
else if (ST.scene === "play") { ST.hudMode = true; if (ST.G.hud) ST.G.hud(); ST.drawPauseBtn(); ST.hudMode = false; ST.drawJoy(); }
else if (ST.scene === "paused") { if (ST.G.hud) ST.G.hud(); ST.drawPaused(); }
else if (ST.scene === "over") ST.drawOver();
if (ST.G.top) { ST.trackUI = false; ST.G.top(); ST.trackUI = true; }   // optional: decoration on top of everything (keep it in the bottom 30%)
};
let last = performance.now(), acc = 0;
ST.now = last; ST.frameNo = 0;
ST.frame = now => {
ST.now = now; ST.frameNo++;
ST.readPad();                                   // never throws (see input.js)
if (ST.cw !== innerWidth || ST.ch !== innerHeight || ST.canvas.width !== Math.round(innerWidth * ST.DPR())) ST.resize();
const dtm = now - last; last = now;
if (!document.hidden) { acc += Math.min(dtm, 100); let n = 0; while (acc >= 1000 / 60 && n++ < 5) { ST.update(1 / 60); acc -= 1000 / 60; } if (n >= 5) acc = 0; } else acc = 0;
if (ST.cw) ST.draw();
requestAnimationFrame(ST.frame);
};
function uiReport() {
const dom = [...document.querySelectorAll("[data-control]")].filter(e => getComputedStyle(e).display !== "none")
.map(e => { const r = e.getBoundingClientRect(); return { id: e.id, x: r.left, y: r.top, w: r.width, h: r.height }; });
const rects = ST.hud.concat(ST.scene === "play" ? dom : []), G = 4, W = Math.ceil(ST.cw / G), H = Math.ceil(ST.ch / G), cells = new Uint8Array(W * H);
for (const r of rects) for (let y = Math.max(0, Math.floor(r.y / G)); y < Math.min(H, Math.ceil((r.y + r.h) / G)); y++)
for (let x = Math.max(0, Math.floor(r.x / G)); x < Math.min(W, Math.ceil((r.x + r.w) / G)); x++) cells[y * W + x] = 1;
let n = 0; for (const c of cells) n += c;
const round = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, typeof v === "number" ? Math.round(v * 10) / 10 : v]));
return { texts: ST.uiTexts.map(round), hud: ST.hud.map(round), dom: dom.map(round), hudCover: W * H ? +(n / (W * H)).toFixed(3) : 0 };
}
window.__gs = () => {
const S = ST.sound, m = S.music;
return Object.assign({
scene: ST.scene, framed: ST.framed, small: ST.small, paused: !!document.hidden, ticks: ST.ticks, time: +ST.time.toFixed(3), seq: ST.seq,
test: ST.TEST_BUILD, switched: ST.switched, version: ST.cfg.v, addons: ST.cfg.addons.slice(),
buttons: ST.btns.map(q => ({ id: q.id, label: q.label, x: q.x, y: q.y, w: q.w, h: q.h })),
layout: { w: ST.cw, h: ST.ch, scale: +ST.sc.toFixed(3), buffer: [ST.canvas.width, ST.canvas.height], world: [ST.BW, ST.BH], uiBottom: ST.uiBottom, safe: ST.L },
sound: { on: S.on, muted: S.muted, ctx: S.ac ? S.ac.state : null, music: m ? { paused: m.paused, muted: m.muted, time: m.currentTime } : null },
save: { ok: ST.store.ok, data: JSON.parse(JSON.stringify(ST.save.data)) },
drag: ST.drag.on,
input: { keys: [...ST.keys], drag: ST.drag.on, dragId: ST.drag.id, clears: ST.inputStats.clears, last: ST.inputStats.last,
pad: { ok: ST.pad.ok, connected: ST.pad.connected, errors: ST.pad.errors } },
ui: uiReport(),
render3d: self.ST3D && ST3D.auto ? ST3D.auto.report() : null,
tour: ST.G.tour || [],
startSeed: ST.startSeed == null ? null : ST.startSeed,   // rng state right after the game's start() (seeded runs: must not depend on robot waits)
}, ST.G.hook ? ST.G.hook() : {});
};
ST.run = G => {
ST.G = G;
ST.switched = Object.values(ST.sw).some(Boolean);
if (ST.sw.seed) ST.seed = ST.sw.seed >>> 0;
if (ST.sw.card) ST.root.classList.add("card");
Object.assign(ST.sound.SFX, { start: t => { t(523, 523, 0.08, "triangle", 0.05); t(784, 784, 0.12, "triangle", 0.05, 0.08); },
tap: t => t(660, 640, 0.03, "triangle", 0.03), win: t => [523, 659, 784, 1046].forEach((f, i) => t(f, f, 0.25, "sine", 0.06, i * 0.12)),
lose: t => t(392, 98, 0.8, "sawtooth", 0.06) }, G.sfx || {});
ST.save.load(G.saveDefaults || {});
addEventListener("resize", ST.resize);
ST.resize();
if (G.init) G.init();
try { ST.draw(); } catch (e) { setTimeout(() => { throw e; }); }
document.getElementById("loading").classList.add("off");
window.__ready = true;
requestAnimationFrame(ST.frame);
};

const COL = { sky: "#1c1030", sky2: "#2c1a4a", bar: "#0a0610", edge: "#f2a444", star: "#ffd94a", star2: "#fff3c0", ground: "#2a1a38" };
const ROUND = 15, CW = 90, CH = 160;
let P, t = 0, taps = 0, pop = 0, ox = 0, oy = 0;
ST.onResize = () => {                            // world = 9:16 column, letterboxed; buffer covers the whole frame
const S = ST, a = S.cw / S.ch;
if (a >= CW / CH) { S.BH = CH; S.BW = Math.round(CH * a); } else { S.BW = CW; S.BH = Math.round(CW / a); }
ox = Math.floor((S.BW - CW) / 2); oy = 0;
S.buf = S.mk(S.BW, S.BH); S.g = S.buf.getContext("2d"); S.sc = S.cw / S.BW; S.SY = Math.floor(S.BH * S.SAFE);
};
ST.drawJoy = () => {};                          // a tap game: no joystick ring
const firstFrame = { w: innerWidth, h: innerHeight };
const GAME = {
title: {
name: "Tall Tap",
lines: ["Tap the star as fast as you can!"],
cardLine: "TAP TO PLAY IN THE POST",
footer: () => ST.save.data.best ? "BEST: " + ST.save.data.best : "",
},
saveDefaults: { best: 0 },
start() { t = ROUND; taps = 0; pop = 0; P = { x: CW / 2, y: Math.round(ST.SY * 0.62) }; },
tap(x, y) { const b = ST.toBuf(x, y); return hit(b.x, b.y); },
key(code) { if (code === "Space" || code === "Enter") return hit(ox + P.x, P.y); return false; },
update(dt) { pop = Math.max(0, pop - dt * 4); t -= dt; if (t <= 0) { t = 0; ST.end(); } },
draw(time) {
const { R, ell, BW, BH, SY } = ST;
R(0, 0, BW, BH, COL.bar);                                      // letterbox bars (only seen when the frame is not 9:16)
for (let y = 0; y < BH; y += 8) R(ox, y, CW, 8, y < SY * 0.5 ? COL.sky : COL.sky2);
for (let i = 0; i < 14; i++) ST.px(ox + (i * 37) % CW, (i * 23) % (SY - 10), (time * 2 + i) % 3 < 1 ? COL.star2 : "#8a7aa8");
R(ox, SY, CW, BH - SY, COL.ground);                            // below the 70% line: decoration only
if (ox > 0) { R(ox - 1, 0, 1, BH, COL.edge); R(ox + CW, 0, 1, BH, COL.edge); }
const s = ST.scene === "title" ? { x: CW / 2, y: Math.round(SY * 0.8) } : P;
if (!s) return;
const r = 7 + Math.round(pop * 3) + ((time * 3 | 0) % 2);
ell(ox + s.x, s.y, r, r, COL.star); ell(ox + s.x, s.y, r - 3, r - 3, COL.star2);
},
hud() { ST.text("TAPS " + taps + "   " + Math.ceil(t) + "S", 52, 16, ST.theme.text, ST.fs); },
over: () => {
const best = Math.max(ST.save.data.best, taps), rec = taps > ST.save.data.best;
ST.save.data.best = best; ST.save.write();
return { win: taps > 0, title: rec ? "NEW BEST!" : "TIME'S UP", lines: ["You tapped " + taps + " times.", "Best: " + best] };
},
sfx: { get: tn => tn(988, 1319, 0.06, "sine", 0.05) },
hook: () => ({ player: P ? { x: P.x, y: P.y } : null, taps: taps || 0, left: t || 0, hp: 1,
frame: { w: innerWidth, h: innerHeight, aspect: +(innerWidth / Math.max(1, innerHeight)).toFixed(3), tall: innerHeight > innerWidth * 1.2,
dpr: window.devicePixelRatio || 1, first: firstFrame, letterbox: ox > 0 ? "sides" : ST.BH > CH ? "taller" : "none" } }),
};
function hit(bx, by) {                          // tap within the star (generous, at least 44 css px across)
const rr = Math.max(12, 24 / ST.sc);
if (Math.hypot(bx - ox - P.x, by - P.y) > rr) return false;
taps++; pop = 1; ST.sfx("get");
P.x = 14 + Math.round(ST.rand() * (CW - 28)); P.y = 34 + Math.round(ST.rand() * Math.max(10, ST.SY - 50));
return true;
}
ST.run(GAME);
</script>
